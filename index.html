 {icon:'🍽️',category:'baschi',title:'Bacalao al pil-pil',it:{description:'Baccalà cotto lentamente in olio d’oliva con aglio e peperoncino. La salsa diventa cremosa grazie all’emulsione dell’olio con la gelatina del pesce, senza panna.',tip:'Da provare in un pranzo seduti, possibilmente domenica.'},es:{description:'Bacalao cocinado suavemente en aceite de oliva con ajo y guindilla. La salsa cremosa se consigue al emulsionar el aceite con la gelatina del pescado, sin nata.',tip:'Ideal para una comida sentados, por ejemplo el domingo.'}},
 {icon:'🌶️',category:'baschi',title:'Bacalao a la vizcaína',it:{description:'Un’altra preparazione tipica: baccalà con salsa rossa a base di peperoni choriceros e cipolla. Sapore ricco ma molto diverso dal pil-pil.',tip:'Se amate i sughi saporiti, confrontatelo con il pil-pil.'},es:{description:'Otra preparación típica: bacalao con salsa roja de pimientos choriceros y cebolla. Tiene un sabor intenso y es muy distinto del pil-pil.',tip:'Si os gustan las salsas sabrosas, comparadlo con el pil-pil.'}},
 {icon:'🥩',category:'baschi',title:'Txuleta',it:{description:'Grande costata di manzo alla brace, spesso frollata e servita al sangue. È un piatto da condividere, importante anche nel prezzo.',tip:'Chiedete peso, prezzo e punto di cottura prima di ordinare.'},es:{description:'Gran chuleta de vacuno a la brasa, a menudo madurada y servida poco hecha. Se suele compartir y puede ser un plato de precio elevado.',tip:'Preguntad por peso, precio y punto de cocción antes de pedir.'}},
 {icon:'🍲',category:'baschi',title:'Marmitako',it:{description:'Stufato di mare con tonno bianco, patate, cipolla e peperoni. È legato soprattutto alla stagione del bonito; a dicembre potrebbe non essere disponibile.',tip:'Se compare nel menù, chiedete se è preparato al momento e con quale pesce.'},es:{description:'Guiso marinero de bonito, patata, cebolla y pimiento. Está asociado sobre todo a la temporada del bonito; quizá no lo encontréis en diciembre.',tip:'Si aparece en carta, preguntad qué pescado utilizan y si se prepara al momento.'}},
 {icon:'🧈',category:'dolci',title:'Sobao pasiego',it:{description:'Dolce soffice, molto ricco di burro e profumato, originario dei Valles Pasiegos. È perfetto con un caffè a colazione o per merenda.',tip:'Ottimo souvenir da acquistare confezionato in Cantabria.'},es:{description:'Bizcocho esponjoso, muy mantecoso y aromático, originario de los Valles Pasiegos. Perfecto para desayunar o acompañar un café.',tip:'Un buen recuerdo gastronómico para llevar de Cantabria.'}},
 {icon:'🍮',category:'dolci',title:'Quesada pasiega',it:{description:'Dolce compatto e umido con latte o cagliata, uova, zucchero, limone e talvolta cannella. Non è la classica cheesecake: ha una consistenza propria.',tip:'Provatela fresca durante il soggiorno a Santander.'},es:{description:'Dulce jugoso y compacto con leche o cuajada, huevos, azúcar, limón y a veces canela. No es una tarta de queso habitual: tiene su propia textura.',tip:'Probadla fresca durante la estancia en Santander.'}},
 {icon:'🥂',category:'dolci',title:'Txakoli',it:{description:'Vino bianco basco fresco, aromatico e con acidità vivace. Spesso accompagna bene pintxos, acciughe e pesce.',tip:'Chiedete un calice locale e bevete responsabilmente.'},es:{description:'Vino blanco vasco fresco, aromático y de acidez viva. Suele acompañar muy bien pintxos, anchoas y pescado.',tip:'Pedid una copa local y bebed con moderación.'}}

let language=(navigator.language||'').toLowerCase().startsWith('es')?'es':'it', activeDay=0, foodFilter='all';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const googleSearch=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
function googleDirections(route){let url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(route.start)+'&destination='+encodeURIComponent(route.end)+'&travelmode='+route.mode;if(route.waypoints.length)url+='&waypoints='+encodeURIComponent(route.waypoints.join('|'));return url;}
// Google Maps embedded view without a private API key; the full route opens via official Google Maps URLs.
const googleEmbed=q=>'https://maps.google.com/maps?q='+encodeURIComponent(q)+'&z=14&output=embed';
const link=(url,label,primary=false)=>'<a class="btn'+(primary?' primary':'')+'" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+' ↗</a>';
function render(){const t=T[language];document.documentElement.lang=language;document.title=language==='it'?'La nostra fuga · Santander & Bilbao':'Nuestra escapada · Santander & Bilbao';$('lang-it').setAttribute('aria-pressed',String(language==='it'));$('lang-es').setAttribute('aria-pressed',String(language==='es'));$('shareText').textContent=t.share;
$('heroEye').textContent=t.heroEye;$('heroTitle').innerHTML=t.heroTitle;$('heroDescription').textContent=t.heroDescription;$('heroPills').innerHTML=t.pills.map(v=>'<span class="pill">'+esc(v)+'</span>').join('');
const anchors=['panoramica','giorni','gastronomia','alloggi','spostamenti','preparativi'];$('nav').innerHTML=t.nav.map((label,i)=>'<a href="#'+anchors[i]+'">'+esc(label)+'</a>').join('');
for(const name of ['summary','days','food','stay','transport','tasks']){ $(name+'Eye').textContent=t[name+'Eye'];$(name+'Title').textContent=t[name+'Title'];$(name+'Lead').textContent=t[name+'Lead'];}
$('summaryCards').innerHTML=t.summaryCards.map(c=>'<article class="card"><span class="info-label">'+esc(c.eyebrow)+'</span><div class="big-stat">'+esc(c.headline)+'</div><p><strong>'+esc(c.body)+'</strong></p><p class="small">'+esc(c.fine)+'</p></article>').join('');$('timeline').innerHTML=t.timeline.map(s=>'<div class="step"><b>'+esc(s[0])+'</b>'+esc(s[1])+'</div>').join('');renderDays();renderFood();renderStay();renderTransport();renderTasks();$('footerTitle').textContent=t.footerTitle;$('footerNote').textContent=t.footerNote;$('sourcesTitle').textContent=t.sourcesTitle;}
function renderDays(){const t=T[language];$('dayTabs').innerHTML=t.days.map((d,i)=>'<button type="button" class="day-tab" role="tab" aria-selected="'+(i===activeDay)+'" data-day="'+i+'"><strong>'+esc(d.tab)+'</strong><span>'+esc(d.place)+'</span></button>').join('');$('dayTabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeDay=Number(b.dataset.day);renderDays();}));const d=t.days[activeDay],m=mapLocations[activeDay];let secondary='';if(activeDay===0)secondary=link(googleDirections({start:'Aeropuerto Seve Ballesteros Santander',end:'Mies del Valle 4 Santander',waypoints:[],mode:'transit'}),t.hotelDirections);if(activeDay===1)secondary=link(googleSearch('Bruno Mauricio Zabala Kalea 57 Bilbao'),t.hotelDirections)+link('https://www.alsa.com/',t.busTickets);if(activeDay===2)secondary=link(googleSearch('Funicular Artxanda estación inferior Bilbao'),t.funicularMap)+link(googleSearch('Mirador de Artxanda Bilbao'),t.mapOpen);if(activeDay===3)secondary=link('https://www.guggenheim-bilbao.eus/horarios-y-tarifas',t.museumTickets)+link('https://www.alsa.com/',t.busTickets)+link(googleDirections({start:'Bruno Mauricio Zabala 57 Bilbao',end:'Bilbao Intermodal',waypoints:[],mode:'transit'}),t.routeTransit);if(activeDay===4)secondary=link(googleDirections(m),t.airportDirections,true);
$('dayContent').innerHTML='<article class="card"><span class="day-sub">'+esc(d.date)+'</span><h3 class="day-title">'+esc(d.title)+'</h3><p class="day-desc">'+esc(d.intro)+'</p><ol class="stoplist">'+d.steps.map(step=>'<li class="stop"><time>'+esc(step[0])+'</time><div><h4>'+esc(step[1])+'</h4><p>'+esc(step[2])+'</p></div></li>').join('')+'</ol><p class="notice"><b>'+esc(t.extraNote)+':</b> '+esc(d.note)+'</p></article><div class="card"><div class="maphead"><h3>'+esc(t.mapTitle)+'</h3><span style="font-size:22px">📍</span></div><div class="mapbox"><iframe title="Google Maps · '+esc(d.place)+'" src="'+esc(googleEmbed(m.center))+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div><p class="map-caption">'+esc(t.mapCaption)+'</p><div class="buttons">'+link(googleDirections(m),m.mode==='transit'?t.routeTransit:t.routeButton,true)+link(googleSearch(m.center),t.mapOpen)+secondary+'</div><div class="rule"></div><b class="info-label">'+esc(t.routeStops)+'</b><div class="route-points">'+d.points.map(v=>'<span class="route-point">'+esc(v)+'</span>').join('')+'</div></div>';
}
function renderFood(){const t=T[language];$('foodIntro').innerHTML=t.foodIntro.map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><p>'+esc(x.body)+'</p></article>').join('');$('foodFilters').innerHTML=t.foodFilters.map(x=>'<button type="button" class="food-filter" data-filter="'+x[0]+'" aria-pressed="'+(foodFilter===x[0])+'">'+esc(x[1])+'</button>').join('');$('foodFilters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{foodFilter=b.dataset.filter;renderFood();}));$('foodGrid').innerHTML=FOOD.filter(x=>foodFilter==='all'||x.category===foodFilter).map(x=>{const f=x[language];const region= x.category==='cantabria'?'Cantabria':x.category==='baschi'?'Euskadi':language==='it'?'Dolci / bevande':'Dulces / bebidas';return '<article class="card foodcard"><div class="emoji" aria-hidden="true">'+x.icon+'</div><div class="region">'+esc(region)+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(f.description)+'</p><div class="taste"><b>'+esc(t.tasteLabel)+'</b>'+esc(f.tip)+'</div></article>';}).join('');$('foodTips').innerHTML='<h3>'+esc(t.foodTipsTitle)+'</h3><ol style="padding-left:18px">'+t.foodTips.map(x=>'<li style="margin:9px 0">'+esc(x)+'</li>').join('')+'</ol><div class="rule"></div><h3>'+esc(t.phrasesTitle)+'</h3><div class="phrase-grid">'+t.phrases.map(x=>'<div class="phrase"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join('')+'</div>';}
function renderStay(){const t=T[language];$('stayCards').innerHTML=t.stayCards.map(c=>'<article class="card"><span class="info-label">'+esc(c.nights)+'</span><h3 style="margin-top:11px">'+esc(c.name)+'</h3><p>📍 '+esc(c.address)+'</p><p class="small">'+esc(c.hint)+'</p><div class="buttons">'+link(googleSearch(c.address),t.showOnMaps,true)+'</div></article>').join('');}
function renderTransport(){const t=T[language];$('transportCards').innerHTML=t.transportCards.map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><p>'+esc(x.body)+'</p><div class="buttons">'+link(x.kind==='alsa'?'https://www.alsa.com/':googleDirections({start:'Bilbao Intermodal',end:'Bruno Mauricio Zabala 57 Bilbao',mode:'transit',waypoints:[]}),x.button,true)+'</div></article>').join('');}
function loadTasks(){try{return JSON.parse(localStorage.getItem('viajeSB2026Checklist')||'[]')}catch(e){return []}}
function renderTasks(){const t=T[language],done=loadTasks();$('taskItems').innerHTML=t.tasks.map((x,i)=>'<label class="check-item"><input type="checkbox" data-check="'+i+'" '+(done[i]?'checked':'')+'><span>'+esc(x)+'</span></label>').join('');$('taskItems').querySelectorAll('input').forEach(x=>x.addEventListener('change',()=>{const a=Array.from($('taskItems').querySelectorAll('input')).map(n=>n.checked);try{localStorage.setItem('viajeSB2026Checklist',JSON.stringify(a))}catch(e){} updateProgress();}));updateProgress();}
function updateProgress(){const t=T[language],v=Array.from($('taskItems').querySelectorAll('input'));const count=v.filter(x=>x.checked).length;$('tasksProgress').textContent=count+' / '+v.length+' '+t.tasksDone;$('progressBar').style.width=(count/v.length*100)+'%';}
function toast(text){const el=$('toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3000)}
function switchLang(lang){if(!T[lang]||lang===language)return;language=lang;try{localStorage.setItem('viajeSB2026Language',lang)}catch(e){} render()}
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>switchLang(b.dataset.lang)));
$('shareBtn').addEventListener('click',async()=>{const t=T[language];if(location.protocol==='file:'){toast(t.shareLocal);return}const url=location.href.split('#')[0];if(navigator.share){try{await navigator.share({title:document.title,url});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(url);toast(t.shareCopied)}catch(e){window.prompt(language==='it'?'Copia il link:':'Copia el enlace:',url)}});
try{const prior=localStorage.getItem('viajeSB2026Language');if(prior==='es')language='es'}catch(e){}
render();
</script>
